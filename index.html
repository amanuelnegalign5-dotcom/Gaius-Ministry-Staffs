(function(){'use strict';const $=id=>document.getElementById(id),get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));let lang=localStorage.gLang||'am',mode='login',me=null,pendingPhoto='';const ORIGINAL_REPORTS=[{"id": "event", "amTitle": "ኢቨንት", "enTitle": "Event", "am": "የጥቅምት ወር የኢቨንት ቲም ሪፖርት\n\nበጥቅምት ወር እቅድ የተያዘው የነበረው የሁሉም ማዕከላት ሊደርስ እንዲሁም HQ ሊደርስ የራዕይ የማጋራት ፕሮግራም ከተጋባዥ 2እንግዶች ጋር በጃክሮስ ሪትሪት ማዕከል ጥቅምት28 ቅዳሜ ተደርጓል ።", "en": "October Event Team Report\n\nThe vision-sharing program planned for October, intended to reach all centers and HQ, was held with two invited guests at Jakros Retreat Center on Saturday, Tikimt 28."}, {"id": "counseling", "amTitle": "ካውንስሊንግ", "enTitle": "Counseling and Support", "am": "የcounseling department የጥቅምት ወር ሪፖርት\n\nበየማዕከሉ ላሉ ልጆች በእሁድ ፕሮግራም ላይ ሊሰጥ የነበረው basic counseling skills focusing on peer በሌሎች ፕሮግራሞች መጣበብ ወደ ህዳር የተላፈ ሆኗል።", "en": "Counseling Department October Report\n\nThe basic counseling-skills training focusing on peers, planned for young people in the centers during the Sunday program, was postponed to Hidar because of congestion with other programs."}, {"id": "research", "amTitle": "ምርምርና ሥልጠና", "enTitle": "Research and Training", "am": "-አስከ ጥቅምት 30 በባለፈው አመት የተሰራ ጥናት ውጤት ዝርዝር ጨርሶ ለየሴንተሮች እና ለዋና ቢሮ ሊገባ ታቅዶ የነበረው ይስራበት የነበረው ሶፍትየር ፍቃድ ዕድሳት በክፍያ በመጠየቁ(በዶላር) በመዘግየቱ ምክያት ተቁዋርጦ የነበረ ሲሆን አሁን እየተሰራበት ነው።\n\n-Multitopic study የትምህርት/ስልጠና ፍላጎታቸውን፣ስለፈተናዎቻቸው፣ከወላጆቻቸው ጋር ስላላቸው ግንኙነት፣በሚኒስትሪው የጠለቀ ህብረት ወይም ቤተሰባዊነት ስሜት ስለመኖሩ ና ስለጋይዮስ የቆይታ ጊዜ ማጠር ምርምር የሚሆን መጠይቅ ማዘጋጀት እስከ ጥቅምት 30 የታቀደ የነበር በስራ ላይ ያለ ያላለቀ ነው።", "en": "The detailed results of last year's research were planned for completion and submission to the centers and HQ by Tikimt 30. Work was interrupted because renewal of the software license required a delayed dollar payment; work has now resumed.\n\nThe multitopic-study questionnaire covers education and training needs, challenges, relationships with parents, deep fellowship and family belonging in the ministry, and reasons for shortened stays at GAIUS. It was planned for Tikimt 30 and remains in progress."}, {"id": "followup", "amTitle": "ክትትል", "enTitle": "Follow-up", "am": "ጋይዮስ ሚኒስትሪ ክትትል ዲፓርትመንት\nየጥቅምት ወር የገርጂ ፣ መካኒሳና ቢሾፍቱ ማዕከል ሪፖርት\n\nበዋና ቢሮ የተሰሩ ስራዎች\n1) በተያዘው እቅድ መሰረት የቢሾፍቱ ማዕከልና የመካነሳ ማዕከል ልጆችና መሪዎች ተተኪ መሪዎች AI እና self-descipline በሚል ርዕስ የተዘጋጀ material እየተጠና ይገኛል።\n2)በየማዕከላቱ follow Up በተመለከተ የሚሰሩ መደበኛ ስራዎች እየተከናወኑ መሆናቸውን በተወካዩች በኩል መከታተል ችሏል፡፡\n\nየመካኒሳ ማዕከል\n1) ከልጆች ጋር በዚ ወር ከሁሉም ፎርማል አባላት ጋር የቴሌግራም ጥናት AI በሚል ርዕስ ተደርጓል\n2) ከልጆች ጋር የተጀመረው \"መልካም ጀነራሎች\" የሚለው መጽሐፍ እየተጠና ነው\n3) በመሪዋች ስብሰባ ላይ ስለ አገልግሎት ሁለት ተከታታይ ስለጠና ተሰቶል\n4) ልጆችን ማግኘት በሞላ ጎደል ጥሩ እየተደረገ ይገኛል (ይህም እየሆነ ያለዉ የሚያዘው ሰዉ በሚመቸዉ መንገድ (bible study,telegram video chat ,በአካል በመገናኘት ምቹ በሆኑ መንገዶች እየተከናወነ ይገኛል)\n\nየገርጂ ማዕከል\n1. Update በተደረገው የልጆች profile መሰረት አንድ መሪ ለሶስት ልጆች በቋሚነት እንዲደውሉና follow Up እንዲያደርጉ assign ተደርጓል\n2) Stewardship በሚል ርዕስ የተዘጋጀ material ማጥናት ተችሏል\n3) የፀሎት ርዕስ ከልጆቻችን በመቀበል መሪዎች መፀለይ ተችሏል\n4) በዚህ ወር በተደረገው እያንዳንዱ ፕሮግራም ከልጆች feedback መቀበል ተችሏል\n\nየቢሾፍቱ ማዕከል\n1) self - discipline በሚል ርዕስ የተዘጋጀ material መጣናት ተችሏል\n2) በስልክና በአካል የሚደረጉ ክትትሎች በተገቢው መንገድ ቀጥለዋል\n3) በማክሰኞ ከመሪዎችና ከልጆች ጋር እየተደረገ ያለው የbible study እንደቀጠለ ይገኛል\n4) ጥቅምት 13 መሪዎች በነበራቸው አዳር ላይ mentorship በሚል ርዕስ ስልጠና መውስድ ተችሏል", "en": "GAIUS Ministry Follow-up Department\nOctober report for the Gerji, Mekanisa and Bishoftu centers\n\nHQ: AI and self-discipline materials are being studied by the Bishoftu and Mekanisa young people, leaders and successor leaders. Representatives confirmed that regular follow-up work continues in each center.\n\nMekanisa: a Telegram AI study was held with formal members; “Good Generals” remains under study; leaders received two consecutive ministry trainings; contact continues through Bible study, Telegram video chat and in-person meetings.\n\nGerji: one leader was assigned to call and follow up three young people; stewardship material was studied; leaders received prayer requests and prayed; feedback was collected after programs.\n\nBishoftu: self-discipline material was studied; telephone and in-person follow-up continued; Tuesday Bible study continued; leaders received mentorship training during the Tikimt 13 overnight program."}, {"id": "service", "amTitle": "አገልግሎት አስተባባሪ", "enTitle": "Service Coordination", "am": "የላፍቶ፤ ደብረዘይት እና ገርጂ የጥቅምት ወር የአገልግሎት ክፍሎች ሪፖርት\n\nገርጂ\nጥቅምት 01፣ 08፣ 15 እና 22 ከፓስተር ፍጹም ጋር ትንቢተ ሚልክያስን የመጽሀፍ ጥናት ክፍል 1-4 ተምረዋል::\nጥቅምት 29 በኢቨንት የአገልግሎት ክፍል አማካኝነት የማዕከሉ መሪዎች፤ተጠባባቂ መሪዎች እና ልጆች በጋር በመሆን movie night አድርገዋል፡፡\n\nደብረ ዘይት\nጥቅምት 01 ከአገልጋይ ፍራኦል ጋር 1ኛ ጴጥሮስን የመጨረሻዉን ክፍል ተምረዋል::\nጥቅምት 08 የማዕከሉ መሪዎች፤ተጠባባቂ መሪዎች እና ልጆች በጋር በመሆን የጸሎት እና የአምልኮ ጊዜ ነበራቸዉ፡፡\nጥቅምት 15 እና 22 ከአገልጋይ ቅዱስ ጋር ወንጌል በሚል ርዕስ ክፍል 1 እና 2 ተምረዋል::\nጥቅምት 29 movie night አድርገዋል፡፡\n\nላፍቶ\nጥቅምት 01 በ1ኛ ዩሀንስ ጥናት ላይ የዉይይት ጊዜ ነበራቸዉ፡፡\nጥቅምት 08 ከፓስተር ዳኜ ጋር “የተከፈተ ሰማይ” በሚል ርዕስ ተምረዋል::\nጥቅምት 15 እና 22 ከፓስተር ኢሳያስ ጋር ደቀመዘሙር ክፍል 1 እና 2 ተምረዋል::\nጥቅምት 29 በደቀመዘሙር ትምህርት ላይ የዉይይት ጊዜ ነበራቸዉ፡፡\nጥቅምት 13 እና 20 አገልግሎት በሚል ርዕስ ለመሪዎች እና ተጠባባቂ መሪዎች ስልጠና ተሰጥቷል፡፡\n\nዋና ቢሮ\nጥቅምት 28 ‘vision oriented life’ በሚል ርዕስ ከሁሉም ማዕከል ካሉ መሪዎች፤ተጠባባቂ መሪዎች እና ተጋባዥ እንግዶች ጋር ዉይይት ተካሂዷል፡፡ በገርጂ ማዕከል የጋይዮስን ራዕይ የማካፈል ፕሮግራም ተካሂዷል፡፡", "en": "October Service Coordination Report for Lafto, Debre Zeit and Gerji\n\nGerji: Malachi Bible-study parts 1–4 were taught on Tikimt 1, 8, 15 and 22. A movie night was held on Tikimt 29 with center leaders, successor leaders and young people.\n\nDebre Zeit: the final part of 1 Peter was taught; prayer and worship were held; Gospel parts 1 and 2 were taught; and a movie night was held.\n\nLafto: discussion on 1 John, “Open Heaven,” Discipleship parts 1 and 2, a discipleship discussion, and two ministry trainings were conducted.\n\nHQ: a “Vision Oriented Life” discussion was held on Tikimt 28 with leaders, successor leaders and invited guests; a GAIUS vision-sharing program was held at the Gerji center."}, {"id": "media", "amTitle": "ሚዲያ", "enTitle": "Media", "am": "የጥቅምት ወር የጋይዮስ ሚዲያ ሪፖርት\n\nሁሉም social media በተያዘላቸው እቅድ መሰረት መቀጥል ተችሏል። ዶክመንቴሽን ተጠናክሮ ቀጥሏል። የመጽሃፍ ቅዱስ ጥቅሶች፣ የእሁድና የሰኞ ፕሮግራሞች ማስታወቂያ፣ የጥቅምት ወር ፎቶ ቪዲዮ፣ የ5 ቀን social media ካምፔን እና ዶክመንተሪ ተለቋል።\n\nFACEBOOK: oct 13-nov 12 118,181 view፣ 7,558 Engagement፣ 324 አዳዲስ ተከታዮች፣ በአጠቃላይ 26,024 ተከታዮች።\nTELEGRAM: oct 13-nov 12 1,863 ደርሰናል።\nINSTAGRAM: oct 13-nov 12 150,335 view፣ ከ420 በላይ follower፣ በአጠቃላይ 5,589 ተከታዮች።\nYOUTUBE: 4,800 view፣ ከ84 በላይ አዳዲስ ተከታዮች።\nTIK TOK: 44,000 view፣ ከ80 በላይ follower፣ በአጠቃላይ 30,480 ተከታዮች።\nWEB SITE: በ1 ወር ውስጥ 1 ጊዜ update ተደርጓል።", "en": "GAIUS Media Report for October\n\nAll social-media work continued according to plan and documentation was strengthened. Bible verses, Sunday and Monday program announcements, an October photo video, a five-day social-media campaign, and a documentary were published.\n\nFacebook, Oct 13–Nov 12: 118,181 views, 7,558 engagements, 324 new followers, 26,024 total followers.\nTelegram: reach of 1,863.\nInstagram: 150,335 views, more than 420 new followers, 5,589 total followers.\nYouTube: 4,800 views and more than 84 new followers.\nTikTok: 44,000 views, more than 80 new followers, 30,480 total followers.\nWebsite: updated once during the month."}];

function allReports(){let custom=get('reports',[]);return ORIGINAL_REPORTS.map(r=>({...r,month:'2026-10',status:'locked',submittedAt:'2026-11-01T09:00:00Z',original:true})).concat(custom)}function reportCard(r){let c=get('comments',[]).find(x=>x.reportId===r.id&&x.directorId===me.id),text=r.original?r[lang]:r.result;return `<article class="card"><div class="top"><h2>${esc(r.original?(lang==='am'?r.amTitle:r.enTitle):r.department)}</h2><span class="locked">🔒 ${lang==='am'?'ተዘግቷል':'Locked'}</span></div><div class="muted">${r.month} · ${new Date(r.submittedAt).toLocaleDateString()}</div><div class="reporttext">${esc(text)}</div>${r.challenge?`<p><b>Challenge:</b> ${esc(r.challenge)}</p>`:''}${r.nextAction?`<p><b>Next:</b> ${esc(r.nextAction)}</p>`:''}${isDirector()?`<label>Director comment</label><textarea id="comment-${r.id}">${esc(c?.text||'')}</textarea><button class="btn commentBtn" data-id="${r.id}">Save / edit comment</button>`:(c&&c.visible?`<div class="notice">${esc(c.text)}</div>`:'')}</article>`}function renderReports(){if(!canReport()){ $('reportList').innerHTML='';return }let q=$('search').value.toLowerCase(),m=$('monthFilter').value,a=allReports().filter(r=>(!m||r.month===m)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));$('reportList').innerHTML=a.map(reportCard).join('')}$('search').oninput=renderReports;$('monthFilter').onchange=renderReports;document.addEventListener('click',e=>{let b=e.target.closest('.commentBtn');if(b&&isDirector()){let a=get('comments',[]),old=a.find(x=>x.reportId===b.dataset.id&&x.directorId===me.id),rec={id:old?.id||uid(),reportId:b.dataset.id,directorId:me.id,author:me.name,text:$('comment-'+b.dataset.id).value,visible:true,updatedAt:new Date().toISOString()};set('comments',old?a.map(x=>x.id===old.id?rec:x):a.concat(rec));renderReports()}});
$('submitReport').onclick=()=>{if(!canReport())return;let act=$('activity').value.trim();if(!act)return $('reportMsg').textContent='Activity required.';let a=get('reports',[]);a.push({id:uid(),userId:me.id,department:$('reportDept').value,month:$('reportMonth').value,activity:act,result:$('result').value.trim(),challenge:$('challenge').value.trim(),nextAction:$('nextAction').value.trim(),status:'locked',submittedAt:new Date().toISOString(),original:false});set('reports',a);['activity','result','challenge','nextAction'].forEach(i=>$(i).value='');renderAll();show('reports')};
function renderDashboard(){if(!canReport())return;let a=allReports(),annual=$('period').value==='annual',period=annual?String($('dashYear').value):$('dashMonth').value;a=a.filter(r=>annual?r.month.startsWith(period+'-'):r.month===period);$('kCount').textContent=a.length;$('kSubmitted').textContent=a.length;$('kApproved').textContent=get('comments',[]).filter(c=>a.some(r=>r.id===c.reportId)).length;$('kPending').textContent=Math.max(0,a.length-+$('kApproved').textContent);$('recent').innerHTML=a.slice(-5).reverse().map(reportCard).join('')||'—';let yr=$('dashYear').value,vals=Array.from({length:12},(_,i)=>{let mm=yr+'-'+String(i+1).padStart(2,'0');return allReports().filter(r=>r.month===mm).length});let max=Math.max(1,...vals);$('monthChart').innerHTML=vals.map((v,i)=>`<div><i style="height:${v/max*130}px"></i><small>${i+1}</small><small>${v}</small></div>`).join('');let deps=['Media','Follow-up','Service Coordination','Counseling and Support','Research and Training','Event'];$('deptSummary').innerHTML=deps.map(d=>`<div class="item"><b>${d}</b><span class="pill" style="float:right">${a.filter(r=>(r.department||r.enTitle)===d).length}</span></div>`).join('')}$('period').onchange=renderDashboard;$('dashMonth').onchange=renderDashboard;$('dashYear').oninput=renderDashboard;
const seedPeople=[{id:'selam',name:'Selam',role:'service_leader',regular:false},{id:'kesemay',name:'ከሰማይ',role:'event_leader',regular:false},{id:'meron',name:'Meron',role:'staff',regular:false},{id:'nathnael',name:'Nathnael',role:'media_leader',monthlyOnce:true}];if(!localStorage.seedPeople)set('seedPeople',seedPeople),localStorage.seedPeople=1;function people(){return seedPeople.concat(get('users',[]).map(u=>({id:u.id,name:u.name,role:u.role,department:u.department,photo:u.photo,profession:u.profession,regular:true})))}function expected(p,date){if(p.monthlyOnce){return !get('attendance',[]).some(a=>a.personId===p.id&&a.date.startsWith(date.slice(0,7))&&a.status==='present')}return p.regular!==false}function renderAttendance(){let ps=people(),ats=get('attendance',[]);$('attPerson').innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('attendanceList').innerHTML=ats.slice().reverse().map(a=>{let p=ps.find(x=>x.id===a.personId);return `<div class="item"><b>${esc(p?.name)}</b> · ${a.date} · <span class="pill">${a.status}</span><div class="muted">${esc(a.note)}</div></div>`}).join('')||'—'}$('saveAttendance').onclick=()=>{if(!attendanceManagers.includes(me.role))return;let a=get('attendance',[]);a.push({id:uid(),personId:$('attPerson').value,date:$('attDate').value,status:$('attStatus').value,note:$('attNote').value,recordedBy:me.id,createdAt:new Date().toISOString()});set('attendance',a);renderAttendance()};
function attach(file,cb){if(!file)return cb(null);if(file.size>2*1024*1024)return alert('Maximum 2 MB');let r=new FileReader();r.onload=()=>cb({name:file.name,data:r.result,type:file.type});r.readAsDataURL(file)}function attachment(a){return a?`<div class="attach">📎 <a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a></div>`:''}$('publishAnn').onclick=()=>attach($('annFile').files[0],f=>{let a=get('announcements',[]);a.push({id:uid(),title:$('annTitle').value,body:$('annBody').value,file:f,author:me.name,createdAt:new Date().toISOString()});set('announcements',a);renderBoard()});function renderBoard(){$('annList').innerHTML=get('announcements',[]).slice().reverse().map(x=>`<div class="item"><b>${esc(x.title)}</b><div>${esc(x.body)}</div>${attachment(x.file)}<div class="muted">${esc(x.author)} · ${new Date(x.createdAt).toLocaleString()}</div></div>`).join('')||'—'}$('saveProject').onclick=()=>attach($('proFile').files[0],f=>{let a=get('projects',[]);a.push({id:uid(),title:$('proTitle').value,body:$('proBody').value,owner:$('proOwner').value,due:$('proDue').value,file:f,createdAt:new Date().toISOString()});set('projects',a);renderWorkspace()});function renderWorkspace(){let ps=people();$('proOwner').innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('projectList').innerHTML=get('projects',[]).map(x=>`<div class="item"><b>${esc(x.title)}</b><div>${esc(x.body)}</div><div class="muted">Owner: ${esc(ps.find(p=>p.id===x.owner)?.name)} · ${x.due}</div>${attachment(x.file)}</div>`).join('')||'—'}

$('addDocument').onclick=()=>{if(!isDirector())return;let f=$('docFile').files[0],title=$('docTitle').value.trim();if(!title||!f)return;if(!['application/pdf','image/jpeg','image/png'].includes(f.type)||f.size>5*1024*1024)return alert('PDF/JPG/PNG up to 5 MB');let a=get('documents',[]);a.push({id:uid(),title,type:$('docType').value,expiry:$('docExpiry').value,fileName:f.name,ownerId:me.id,createdAt:new Date().toISOString()});set('documents',a);renderDocuments()};function renderDocuments(){$('docList').innerHTML=get('documents',[]).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${esc(x.type)} · ${esc(x.fileName)} · ${x.expiry||'—'}</div></div>`).join('')||'—'}
function show(id){if(!canReport()&&['dashboard','reports','reportEntry'].includes(id))id='attendance';document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav').forEach(x=>{let on=x.dataset.page===id;x.classList.toggle('on',on);x.classList.toggle('ghost',!on)});if(id==='profilePage')renderProfile();if(id==='documents')renderDocuments()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.page));function renderAll(){renderDashboard();renderReports();renderAttendance();renderBoard();renderWorkspace();renderDirectory();renderProfile();if(isDirector())renderDocuments()}applyLanguage(lang);setMode('login');let u=get('users',[]).find(x=>x.id===sessionStorage.me);if(u)openApp(u);
